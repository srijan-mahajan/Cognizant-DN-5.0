<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container mt-5">
      <h2>Dashboard Cards</h2>

      <div class="row">
        <div class="col-md-3 mb-3">
          <div class="bg-primary text-white p-4">Users</div>
        </div>

        <div class="col-md-3 mb-3">
          <div class="bg-success text-white p-4">Sales</div>
        </div>

        <div class="col-md-3 mb-3">
          <div class="bg-warning p-4">Revenue</div>
        </div>

        <div class="col-md-3 mb-3">
          <div class="bg-danger text-white p-4">Alerts</div>
        </div>
      </div>
    </div>
    <hr class="my-5" />

    <div class="container">
      <div class="bg-dark bg-gradient text-white p-5 rounded">
        <h2>Gradient Section</h2>

        <p>
          This section uses a dark background with Bootstrap's gradient utility.
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
