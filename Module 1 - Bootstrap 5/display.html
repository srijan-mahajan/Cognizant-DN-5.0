<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>Display</title>
  </head>
  <body>
    <div class="container mt-5">
      <h2>Responsive Visibility</h2>

      <!-- Hidden on all screens, visible from md and above -->
      <div class="d-none d-md-block bg-primary text-white p-3 mb-3">
        Visible on Tablet and Desktop
      </div>

      <!-- Hidden until large screens -->
      <div class="d-none d-lg-flex bg-success text-white p-3">
        Visible only on Large Screens and Above
      </div>
    </div>
    <hr class="my-5" />

    <div class="container">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 d-none d-md-block">
          <div class="bg-dark text-white p-3">
            <h4>Sidebar</h4>

            <ul class="list-unstyled">
              <li>Dashboard</li>
              <li>Users</li>
              <li>Reports</li>
              <li>Settings</li>
            </ul>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9">
          <div class="border p-3">
            <h3>Main Content</h3>

            <p>
              On mobile screens, the sidebar disappears and only this content
              remains visible.
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
