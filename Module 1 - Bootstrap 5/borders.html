<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>Borders</title>
  </head>
  <body>
    <div class="container mt-5">
      <h2>Border Utilities</h2>

      <div class="border border-primary border-3 p-4 mb-4">
        This box has:
        <ul>
          <li>Border</li>
          <li>Primary color border</li>
          <li>Thickness level 3</li>
        </ul>
      </div>

      <h2>Rounded Circle Image</h2>

      <img
        src="https://via.placeholder.com/200"
        alt="Profile"
        class="rounded-circle border border-dark border-3"
      />
    </div>
    <hr class="my-5" />

    <div class="container">
      <h2>Shadow Card</h2>

      <div class="card shadow-lg rounded-pill p-4">
        <h4>Bootstrap Card</h4>

        <p>This card uses a large shadow and pill-shaped corners.</p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
