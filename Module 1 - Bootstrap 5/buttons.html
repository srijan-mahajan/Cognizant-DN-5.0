<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Buttons</title>
  </head>
  <body>
    <div class="container mt-5">
      <h2>Contextual Buttons</h2>

      <button class="btn btn-primary">Primary</button>

      <button class="btn btn-secondary">Secondary</button>

      <button class="btn btn-success">Success</button>

      <button class="btn btn-danger">Danger</button>

      <button class="btn btn-warning">Warning</button>

      <button class="btn btn-info">Info</button>

      <button class="btn btn-dark">Dark</button>

      <button class="btn btn-light">Light</button>
    </div>

    <hr class="my-5" />

    <h2>Outline Buttons</h2>

    <button class="btn btn-outline-primary">Primary</button>

    <button class="btn btn-outline-success">Success</button>

    <button class="btn btn-outline-danger">Danger</button>

    <button class="btn btn-outline-dark">Dark</button>

    <hr class="my-5" />

    <h2>Button Group</h2>

    <div class="btn-group">
      <button class="btn btn-primary">Left</button>

      <button class="btn btn-primary">Middle</button>

      <button class="btn btn-primary">Right</button>
    </div>

    <hr class="my-5" />

    <h2>Toggle Buttons</h2>

    <input type="checkbox" class="btn-check" id="check1" />

    <label class="btn btn-outline-success" for="check1"> Option 1 </label>

    <input type="checkbox" class="btn-check" id="check2" />

    <label class="btn btn-outline-primary" for="check2"> Option 2 </label>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
