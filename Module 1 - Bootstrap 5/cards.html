<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>Cards</title>
  </head>
  <body>
    <div class="container mt-5">
      <h2>Profile Card</h2>

      <div class="card" style="width: 18rem">
        <img
          src="https://via.placeholder.com/300x200"
          class="card-img-top"
          alt="Profile Image"
        />

        <div class="card-body">
          <h5 class="card-title">John Doe</h5>

          <p class="card-text">Web Developer and Bootstrap Learner.</p>

          <a href="#" class="btn btn-primary"> View Profile </a>
        </div>
      </div>
    </div>

    <hr class="my-5" />

    <h2>Media Layout</h2>

    <div class="container">
      <div class="d-flex align-items-start border p-3">
        <img src="https://via.placeholder.com/100" alt="Profile" class="me-3" />

        <div>
          <h5>Article Title</h5>

          <p>
            This is a media-style layout where the image is aligned to the left
            and content appears on the right.
          </p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
