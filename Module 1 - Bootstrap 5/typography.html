<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Typography</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="display-1">Display Heading</h1>

      <p class="lead">
        This is a lead paragraph. It stands out from normal text.
      </p>

      <p class="text-muted">This text is muted.</p>

      <p class="fw-bold">This text is bold.</p>
    </div>

    <hr class="my-5" />

    <h2>Exercise 7.2</h2>

    <p class="text-uppercase">hello bootstrap</p>

    <p class="text-lowercase">HELLO BOOTSTRAP</p>

    <p class="text-capitalize">hello bootstrap student</p>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
