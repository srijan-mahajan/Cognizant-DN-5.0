<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Bootstrap Grid</title>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="border p-3">Column 1</div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="border p-3">Column 2</div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="border p-3">Column 3</div>
        </div>
      </div>
    </div>

    <hr class="my-5" />

    <div class="container">
      <div class="row">
        <div class="col">
          <div class="border p-3">First Column</div>
        </div>

        <div class="col">
          <div class="border p-3">Second Column</div>
        </div>

        <div class="col">
          <div class="border p-3">Third Column</div>
        </div>
      </div>
    </div>

    <hr class="my-5" />

    <h2>Exercise 4.1</h2>

    <div class="container">
      <div class="row">
        <div class="col-md-3">
          <div class="border p-3 bg-light">Sidebar</div>
        </div>

        <div class="col-md-9">
          <div class="border p-3">Main Content Area</div>
        </div>
      </div>
    </div>
    <hr class="my-5" />

    <h2>Exercise 4.2</h2>

    <div class="container">
      <div class="row">
        <div class="col-sm-3">
          <div class="border p-3">Column 1</div>
        </div>

        <div class="col-sm-3">
          <div class="border p-3">Column 2</div>
        </div>

        <div class="col-sm-3">
          <div class="border p-3">Column 3</div>
        </div>

        <div class="col-sm-3">
          <div class="border p-3">Column 4</div>
        </div>
      </div>
    </div>

    <hr class="my-5" />

    <h2>Exercise 5.1</h2>

    <div class="container">
      <div
        class="row justify-content-center align-items-center border"
        style="height: 200px"
      >
        <div class="col-4">
          <div class="bg-primary text-white p-3 text-center">Centered Box</div>
        </div>
      </div>
    </div>

    <hr class="my-5" />

    <h2>Exercise 5.2</h2>

    <div class="container">
      <div class="row">
        <div class="col-md-6 order-md-2">
          <div class="bg-warning p-3">First in HTML</div>
        </div>

        <div class="col-md-6 order-md-1">
          <div class="bg-info p-3">Second in HTML</div>
        </div>
      </div>
    </div>
  </body>
</html>
